# CKAN Docker per l'Italia — stack (CKAN 2.12 + Postgres16 + Solr9 + Redis + NGINX)
# I worker in background (jobs/xloader, harvest) girano nel servizio `ckan-worker`
# con la stessa immagine di `ckan`: l'immagine base 2.12 non include supervisord.
# Compose v2: la chiave "version" non e' piu' necessaria.

volumes:
  ckan_storage:
  pg_data:
  solr_data:

# Rotazione dei log dei container (json-file): 20 MB x 3 file per servizio.
# Si applica alla (ri)creazione dei container: `docker compose up -d`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:

  nginx:
    logging: *default-logging
    container_name: ${NGINX_CONTAINER_NAME}
    build:
      context: nginx/
      dockerfile: Dockerfile
    networks:
      - webnet
      - ckannet
    depends_on:
      - ckan
    restart: unless-stopped
    ports:
      # Accesso NON-SSL e SSL: l'utente sceglie quale usare.
      - "0.0.0.0:${NGINX_PORT_HOST}:${NGINX_PORT}"
      - "0.0.0.0:${NGINX_SSLPORT_HOST}:${NGINX_SSLPORT}"

  ckan:
    logging: *default-logging
    container_name: ${CKAN_CONTAINER_NAME}
    image: ${CKAN_CONTAINER_NAME}-image
    build:
      context: ckan/
      dockerfile: Dockerfile
      args:
        - TZ=${TZ}
    networks:
      - ckannet
      - dbnet
      - solrnet
      - redisnet
    # Sorgente UNICA di configurazione: il file .env.
    # (rimossi gli override "environment:" che divergevano sul ?sslmode)
    env_file:
      - .env
    # Per il debug si puo' raggiungere CKAN senza passare da NGINX
    # decommentando la riga seguente (http://localhost:${CKAN_PORT_HOST}).
    # ports:
    #   - "0.0.0.0:${CKAN_PORT_HOST}:${CKAN_PORT}"
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ckan_storage:/var/lib/ckan
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5000/api/3/action/status_show"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Primo avvio lungo (init DB + caricamento vocabolari DCAT-AP_IT):
      # non marcare unhealthy prima di 5 minuti.
      start_period: 300s

  ckan-worker:
    logging: *default-logging
    container_name: ${WORKER_CONTAINER_NAME}
    image: ${CKAN_CONTAINER_NAME}-image
    networks:
      - ckannet
      - dbnet
      - solrnet
      - redisnet
    env_file:
      - .env
    depends_on:
      ckan:
        condition: service_healthy
    volumes:
      - ckan_storage:/var/lib/ckan
    restart: unless-stopped
    # Job worker (xloader, scheduler).
    command: ["ckan", "-c", "/srv/app/ckan.ini", "jobs", "worker"]

  # Consumer harvest: sostituiscono i [program:*] del vecchio supervisord.conf.
  ckan-gather:
    logging: *default-logging
    container_name: ${WORKER_CONTAINER_NAME}-gather
    image: ${CKAN_CONTAINER_NAME}-image
    networks: [ckannet, dbnet, solrnet, redisnet]
    env_file: [.env]
    depends_on:
      ckan:
        condition: service_healthy
    volumes:
      - ckan_storage:/var/lib/ckan
    restart: unless-stopped
    command: ["ckan", "-c", "/srv/app/ckan.ini", "harvester", "gather-consumer"]

  ckan-fetch:
    logging: *default-logging
    container_name: ${WORKER_CONTAINER_NAME}-fetch
    image: ${CKAN_CONTAINER_NAME}-image
    networks: [ckannet, dbnet, solrnet, redisnet]
    env_file: [.env]
    depends_on:
      ckan:
        condition: service_healthy
    volumes:
      - ckan_storage:/var/lib/ckan
    restart: unless-stopped
    command: ["ckan", "-c", "/srv/app/ckan.ini", "harvester", "fetch-consumer"]

  db:
    logging: *default-logging
    container_name: ${POSTGRESQL_CONTAINER_NAME}
    build:
      context: postgresql/
    networks:
      - dbnet
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - CKAN_DB_USER
      - CKAN_DB_PASSWORD
      - CKAN_DB
      - DATASTORE_READONLY_USER
      - DATASTORE_READONLY_PASSWORD
      - DATASTORE_DB
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  solr:
    logging: *default-logging
    container_name: ${SOLR_CONTAINER_NAME}
    networks:
      - solrnet
    build:
      context: solr/
      dockerfile: Dockerfile
    volumes:
      - solr_data:/var/solr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8983/solr/"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    logging: *default-logging
    container_name: ${REDIS_CONTAINER_NAME}
    image: redis:${REDIS_VERSION}
    networks:
      - redisnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  webnet:
  ckannet:
  solrnet:
    internal: true
  dbnet:
    internal: true
  redisnet:
    internal: true
