version: 1
groups:
  - annotation: ckanext-dcatita
    options:
      - key: ckanext.dcatita.subcatalogs_file
        default: ""
        description: Percorso di un subcatalogs.json alternativo (default quello dell'estensione)
      - key: ckanext.dcatita.harvest_verify_ssl
        type: bool
        default: false
        description: Verifica dei certificati TLS negli harvest RDF
      - key: ckanext.dcatita.default_applicable_legislation
        type: bool
        default: true
        description: Imposta l'ELI del regolamento HVD in creazione se assente e il dataset ha hvd_category
      - key: ckanext.dcatita.mqa_badge
        type: bool
        default: false
        description: Mostra nella pagina dataset il punteggio MQA v2 (datasetFinal, scala 0-7,5) letto lato server da data.europa.eu, con cache Redis
      - key: ckanext.dcatita.provenance_template
        default: ""
        description: >
          Testo di dct:provenance per i dataset harvestati (indicatore MQA "Origine").
          Segnaposto disponibili: {holder_name}, {source_catalog_title},
          {source_catalog_homepage}, {site_title}. Vuoto = testo predefinito italiano.
